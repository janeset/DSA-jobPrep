<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DSA Prep Plan</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap">
<script>
  // Apply the saved theme before first paint so there's no flash.
  (function () {
    var s = {};
    try { s = JSON.parse(localStorage.getItem("dsa-prep-v1")) || {}; } catch (e) {}
    var t = s.theme || "system", r = document.documentElement;
    if (t === "system") t = window.matchMedia && matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
    r.setAttribute("data-theme", t);
    r.setAttribute("data-density", s.density || "comfortable");
    r.style.fontSize = { s: "14px", m: "15px", l: "16.5px" }[s.fontSize || "m"];
    if (s.accent) r.style.setProperty("--accent", s.accent);
  })();
</script>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="topbar">
  <div class="topbar-inner">
    <button class="brand" id="brand" title="Go to Today">
      <svg class="logo" viewBox="0 0 28 28" aria-hidden="true"><rect width="28" height="28" rx="8" fill="var(--accent)"/><path d="M14 9.5 9.5 17M14 9.5l4.5 7.5" stroke="var(--accent-ink)" stroke-width="1.8" stroke-linecap="round"/><circle cx="14" cy="9" r="2.6" fill="var(--accent-ink)"/><circle cx="9" cy="18.5" r="2.6" fill="var(--accent-ink)"/><circle cx="19" cy="18.5" r="2.6" fill="var(--accent-ink)"/></svg>
      <span class="brand-text"><b>DSA Prep</b><small>Toronto &amp; KW · 12 weeks</small></span>
    </button>
    <nav id="nav" aria-label="Main">
      <button data-tab="today" class="active"><svg viewBox="0 0 24 24"><path d="M3 11.5 12 4l9 7.5"/><path d="M5.5 10v10h13V10"/></svg><span>Today</span></button>
      <button data-tab="roadmap"><svg viewBox="0 0 24 24"><path d="m9 4-6 2.2v13.6L9 17.6l6 2.2 6-2.2V4l-6 2.2z"/><path d="M9 4v13.6M15 6.2v13.6"/></svg><span>Roadmap</span></button>
      <button data-tab="refreshers"><svg viewBox="0 0 24 24"><path d="M4 5.5A2.5 2.5 0 0 1 6.5 3H20v15H6.5A2.5 2.5 0 0 0 4 20.5z"/><path d="M4 20.5A2.5 2.5 0 0 1 6.5 18H20v3H6.5"/></svg><span>Refreshers</span></button>
      <button data-tab="problems"><svg viewBox="0 0 24 24"><path d="M9 6h11M9 12h11M9 18h11"/><path d="m3.5 6 1 1 2-2M3.5 12l1 1 2-2M3.5 18l1 1 2-2"/></svg><span>Problems</span></button>
      <button data-tab="solutions"><svg viewBox="0 0 24 24"><path d="M9 18h6M10 21h4"/><path d="M12 3a6 6 0 0 0-3.6 10.8c.7.5 1.1 1.3 1.1 2.2h5c0-.9.4-1.7 1.1-2.2A6 6 0 0 0 12 3z"/></svg><span>Solutions</span></button>
      <button data-tab="practice"><svg viewBox="0 0 24 24"><path d="m8 8-4 4 4 4M16 8l4 4-4 4M13.5 5l-3 14"/></svg><span>Practice</span></button>
      <button data-tab="companies"><svg viewBox="0 0 24 24"><path d="M4 21V5a1 1 0 0 1 1-1h9a1 1 0 0 1 1 1v16M15 9h4a1 1 0 0 1 1 1v11M3 21h18M8 8h3M8 12h3M8 16h3"/></svg><span>Companies</span></button>
      <button data-tab="settings"><svg viewBox="0 0 24 24"><path d="M4 6h9M17 6h3M4 12h3M11 12h9M4 18h11M19 18h1"/><circle cx="15" cy="6" r="2"/><circle cx="9" cy="12" r="2"/><circle cx="17" cy="18" r="2"/></svg><span>Settings</span></button>
    </nav>
    <button class="icon-btn" id="theme-quick" title="Toggle light / dark" aria-label="Toggle light or dark theme"></button>
  </div>
</header>
<main id="view"></main>
<script src="data.js"></script>
<script src="refresher.js"></script>
<script src="bigo.js"></script>
<script src="datastructures.js"></script>
<script src="videos.js"></script>
<script src="langlessons.js"></script>
<script src="solutions1.js"></script>
<script src="solutions2.js"></script>
<script src="solutions3.js"></script>
<script src="app.js"></script>
</body>
</html>
