<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Prep Hub</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap">
<script>
  // Apply the saved theme before first paint so there's no flash.
  (function () {
    var s = {};
    try { s = JSON.parse(localStorage.getItem("dsa-prep-v1")) || {}; } catch (e) {}
    var t = s.theme || "system", r = document.documentElement;
    if (t === "system") t = window.matchMedia && matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
    r.setAttribute("data-theme", t);
    r.setAttribute("data-density", s.density || "comfortable");
    r.style.fontSize = { s: "14px", m: "15px", l: "16.5px" }[s.fontSize || "m"];
    if (s.accent) r.style.setProperty("--accent", s.accent);
  })();
</script>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="topbar">
  <div class="topbar-inner">
    <button class="brand" id="brand" title="Go to Today">
      <svg class="logo" viewBox="0 0 28 28" aria-hidden="true"><rect width="28" height="28" rx="8" fill="var(--accent)"/><path d="M14 9.5 9.5 17M14 9.5l4.5 7.5" stroke="var(--accent-ink)" stroke-width="1.8" stroke-linecap="round"/><circle cx="14" cy="9" r="2.6" fill="var(--accent-ink)"/><circle cx="9" cy="18.5" r="2.6" fill="var(--accent-ink)"/><circle cx="19" cy="18.5" r="2.6" fill="var(--accent-ink)"/></svg>
      <span class="brand-text"><b>Prep Hub</b><small>Toronto &amp; KW</small></span>
    </button>
    <nav id="nav" aria-label="Main">
      <button data-nav="home" class="active"><svg viewBox="0 0 24 24"><path d="M3 11.5 12 4l9 7.5"/><path d="M5.5 10v10h13V10"/></svg><span>Home</span></button>
      <span class="nav-sep" aria-hidden="true"></span>
      <button data-track="dsa"><svg viewBox="0 0 24 24"><circle cx="12" cy="5" r="2.2"/><circle cx="6" cy="18" r="2.2"/><circle cx="18" cy="18" r="2.2"/><path d="M11 7 7 16M13 7l4 9"/></svg><span>DSA</span></button>
      <button data-track="cloud"><svg viewBox="0 0 24 24"><path d="M7 18h10.5a4 4 0 0 0 .4-8A6 6 0 0 0 6.4 9.2 4.5 4.5 0 0 0 7 18z"/></svg><span>Cloud</span></button>
      <button data-track="ai"><svg viewBox="0 0 24 24"><path d="M12 3l1.8 4.7L18.5 9.5l-4.7 1.8L12 16l-1.8-4.7L5.5 9.5l4.7-1.8z"/><path d="M18.5 15.5l.8 2 2 .8-2 .8-.8 2-.8-2-2-.8 2-.8z"/></svg><span>AI / LLM</span></button>
      <button data-track="aws"><svg viewBox="0 0 24 24"><circle cx="12" cy="9" r="5"/><path d="M8.5 13 7 21l5-2.5L17 21l-1.5-8"/></svg><span>AWS Certs</span></button>
      <button data-track="roles"><svg viewBox="0 0 24 24"><rect x="3" y="7" width="18" height="13" rx="2"/><path d="M9 7V5a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2M3 13h18"/></svg><span>Roles</span></button>
      <span class="nav-sep" aria-hidden="true"></span>
      <button data-nav="companies"><svg viewBox="0 0 24 24"><path d="M4 21V5a1 1 0 0 1 1-1h9a1 1 0 0 1 1 1v16M15 9h4a1 1 0 0 1 1 1v11M3 21h18M8 8h3M8 12h3M8 16h3"/></svg><span>Companies</span></button>
      <button data-nav="settings"><svg viewBox="0 0 24 24"><path d="M4 6h9M17 6h3M4 12h3M11 12h9M4 18h11M19 18h1"/><circle cx="15" cy="6" r="2"/><circle cx="9" cy="12" r="2"/><circle cx="17" cy="18" r="2"/></svg><span>Settings</span></button>
    </nav>
    <button class="icon-btn" id="theme-quick" title="Toggle light / dark" aria-label="Toggle light or dark theme"></button>
  </div>
  <nav id="subnav" class="subnav" aria-label="Section" hidden></nav>
</header>
<main id="view"></main>
<script src="data.js"></script>
<script src="refresher.js"></script>
<script src="bigo.js"></script>
<script src="datastructures.js"></script>
<script src="videos.js"></script>
<script src="langlessons.js"></script>
<script src="systemdesign.js"></script>
<script src="solutions1.js"></script>
<script src="solutions2.js"></script>
<script src="solutions3.js"></script>
<script src="cloud.js"></script>
<script src="ai.js"></script>
<script src="cloud-more.js"></script>
<script src="ai-more.js"></script>
<script src="roles.js"></script>
<script src="roles-learn.js"></script>
<script src="awscerts.js"></script>
<script src="trackview.js"></script>
<script src="awsview.js"></script>
<script src="roleview.js"></script>
<script src="app.js"></script>
</body>
</html>
